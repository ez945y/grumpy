<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="t d">
<title id="t">沒有知識庫時每個對話都重推一次同樣的答案；有 grumpy 時第一個對話寫下來，其餘的搜出來</title>
<desc id="d">上排：三個對話，每一個都花一小時查同一件事，彼此之間是斷開的，每開一次新對話都從零開始。下排：第一個對話一樣查一小時，但把查到的寫進 grumpy，後面的對話搜一次就找到。寫和搜都是 agent 自己做的。</desc>
<style>
  .b  { stroke-width: 1; }
  .g  { fill: #F1EFE8; stroke: #5F5E5A; }
  .t  { fill: #E1F5EE; stroke: #0F6E56; }
  .th { font: 500 15px system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #2C2C2A; }
  .ts { font: 400 12.5px system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #5F5E5A; }
  .sl { font: 500 11px system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #888780; letter-spacing: .09em; }
  .ln { stroke: #888780; stroke-width: 1.5; fill: none; }
  .x  { stroke: #B4645A; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .g  { fill: #2C2C2A; stroke: #888780; }
    .t  { fill: #04342C; stroke: #1D9E75; }
    .th { fill: #F1EFE8; }
    .ts { fill: #B4B2A9; }
    .sl { fill: #888780; }
    .x  { stroke: #D98B80; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#888780"/></marker></defs>

<text class="sl" x="20" y="22">沒有知識庫</text>

<rect class="b g" x="20" y="44" width="160" height="64" rx="8"/>
<text class="th" x="100" y="72" text-anchor="middle">對話 1</text>
<text class="ts" x="100" y="92" text-anchor="middle">查一個小時</text>

<rect class="b g" x="220" y="44" width="160" height="64" rx="8"/>
<text class="th" x="300" y="72" text-anchor="middle">對話 2</text>
<text class="ts" x="300" y="92" text-anchor="middle">查一個小時</text>

<rect class="b g" x="420" y="44" width="160" height="64" rx="8"/>
<text class="th" x="500" y="72" text-anchor="middle">對話 3</text>
<text class="ts" x="500" y="92" text-anchor="middle">查一個小時</text>

<line class="ln" x1="184" y1="76" x2="192" y2="76"/>
<line class="ln" x1="208" y1="76" x2="216" y2="76"/>
<line class="x" x1="195" y1="71" x2="205" y2="81"/>
<line class="x" x1="205" y1="71" x2="195" y2="81"/>
<line class="ln" x1="384" y1="76" x2="392" y2="76"/>
<line class="ln" x1="408" y1="76" x2="416" y2="76"/>
<line class="x" x1="395" y1="71" x2="405" y2="81"/>
<line class="x" x1="405" y1="71" x2="395" y2="81"/>

<text class="ts" x="20" y="132">每開一次新對話都從零開始</text>

<text class="sl" x="20" y="178">有 GRUMPY</text>

<rect class="b g" x="20" y="196" width="160" height="64" rx="8"/>
<text class="th" x="100" y="224" text-anchor="middle">對話 1</text>
<text class="ts" x="100" y="244" text-anchor="middle">查一個小時</text>

<rect class="b g" x="220" y="196" width="160" height="64" rx="8"/>
<text class="th" x="300" y="224" text-anchor="middle">對話 2</text>
<text class="ts" x="300" y="244" text-anchor="middle">搜一次就好</text>

<rect class="b g" x="420" y="196" width="160" height="64" rx="8"/>
<text class="th" x="500" y="224" text-anchor="middle">對話 3</text>
<text class="ts" x="500" y="244" text-anchor="middle">搜一次就好</text>

<line class="ln" x1="100" y1="262" x2="100" y2="302" marker-end="url(#a)"/>
<text class="ts" x="112" y="286">寫下來</text>
<line class="ln" x1="300" y1="304" x2="300" y2="264" marker-end="url(#a)"/>
<text class="ts" x="312" y="286">搜出來</text>
<line class="ln" x1="500" y1="304" x2="500" y2="264" marker-end="url(#a)"/>

<rect class="b t" x="20" y="306" width="560" height="52" rx="8"/>
<text class="th" x="300" y="330" text-anchor="middle">grumpy</text>
<text class="ts" x="300" y="348" text-anchor="middle">很小的 markdown 筆記，放在 git 裡，搜得到</text>

<text class="ts" x="20" y="382">寫和搜都是 agent 自己做的，你只要說什麼值得留下來</text>
</svg>
